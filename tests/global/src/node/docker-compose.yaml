name: 'global-rosenet-test'

services:
  rosenet-node:
    build:
      context: ../../../..
      dockerfile: ./tests/global/src/node/Dockerfile
    env_file:
      - .env.service
    ports:
      - ${SERVICE_PORT:-55123}:55123
    networks:
      - internal
    volumes:
      - rosenet-node-pk:/app/tests/global/.rosenet
      - ${LOGS_DIRECTORY:-./logs}:/app/tests/global/logs
    depends_on:
      - influxdb
    restart: always

  influxdb:
    image: influxdb
    env_file:
      - .env.influxdb
    ports:
      - ${INFLUXDB_HOST:-127.0.0.1}:${INFLUXDB_PORT:-8086}:8086
    networks:
      - internal
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2
    healthcheck:
      test: ['CMD', 'influx', 'ping']
      timeout: 5s
      interval: 5s
      retries: 2
      start_period: 10s

volumes:
  rosenet-node-pk:
  influxdb-data:
  influxdb2-config:

networks:
  internal:
