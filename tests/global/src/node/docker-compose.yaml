name: 'global-rosenet-test'

services:
  rosenet-node:
    build:
      context: ../../../..
      dockerfile: ./tests/global/src/node/Dockerfile
    env_file:
      - .env.service
    ports:
      - ${SERVICE_PORT:-55123}:55123
    networks:
      - internal
    volumes:
      - rosenet-node-pk:/app/tests/global/.rosenet
    depends_on:
      - influxdb

  influxdb:
    image: influxdb
    env_file:
      - .env.influxdb
    ports:
      - ${INFLUXDB_PORT:-8086}:8086
    networks:
      - internal
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2
    healthcheck:
      test: ['influx', 'ping']
      timeout: 5s
      interval: 5s
      retries: 2
      start_period: 10s

volumes:
  rosenet-node-pk:
  influxdb-data:
  influxdb2-config:

networks:
  internal:
